<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Australian Football Manager V4</title><style>
body{margin:0;background:#08111f;color:#f5f7fb;font-family:system-ui,Arial}header{padding:16px;background:#10233b;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub,.muted{color:#9fb1c9;font-size:12px}nav{display:flex;gap:6px;overflow:auto;padding:8px;background:#0d1929;position:sticky;top:67px;z-index:5}button,select,input{background:#172943;color:#fff;border:1px solid #3c5375;border-radius:9px;padding:9px;font-weight:700}button.primary{background:#176348}button.danger{background:#562532}main{max-width:1150px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#111e31;border:1px solid #2a3c59;border-radius:14px;padding:14px;margin-bottom:12px}.stat{font-size:27px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #293a54;text-align:left}th{color:#9fb1c9}.fixture,.player{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #293a54}.score{font-weight:900}.news{padding:8px;margin:5px 0;background:#14233a;border-left:3px solid #5280c4}.pill{font-size:11px;background:#223754;border-radius:20px;padding:4px 7px}.good{color:#73e2a1}.warn{color:#ffd166}.bad{color:#ff8b8b}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}.modal>div{max-width:500px;width:calc(100% - 30px);background:#111e31;border:1px solid #3c5375;border-radius:14px;padding:16px}@media(max-width:600px){h1{font-size:19px}}
</style></head><body><header><h1>🇦🇺 Australian Football Manager V4</h1><div class="sub">34-match seasons • season history • realistic transfers • club finances • interactive Australia Cup</div></header>
<nav><button onclick="page('home')">🏠</button><button onclick="page('club')">⭐ Club</button><button onclick="page('squad')">👥 Squad</button><button onclick="page('market')">💰 Market</button><button onclick="page('tables')">📊 Tables</button><button onclick="page('fixtures')">📅 Fixtures</button><button onclick="page('cup')">🏆 Cup</button><button onclick="page('history')">🗂 History</button><button onclick="page('news')">📰 News</button></nav><main id="app"></main>
<script src="data.js"></script><script>
const KEY='afm_v4';
const allTeams=()=>[...DATA.tier1,...DATA.tier2,...Object.values(DATA.npl).flat()];
const names=['Alex','Noah','Luca','Kai','Ethan','Mason','Leo','Oscar','Jack','Ryan','Cooper','Dylan','Max','Jayden','Oliver','Finn','Riley','Charlie','Liam','Theo'];
const surnames=['Smith','Brown','Wilson','Taylor','Jones','Williams','Miller','Davis','Moore','Walker','Young','King','Martin','White','Clark','Hall'];
const positions=['GK','CB','CB','LB','RB','CM','CM','CAM','LW','ST','RW'];
let S=JSON.parse(localStorage.getItem(KEY)||'null');
function clubMoney(c){if(!S.finance[c])S.finance[c]={balance:20,budget:8};return S.finance[c]}
function ensureFinance(){S.finance=S.finance||{};allTeams().forEach(c=>{if(!S.finance[c])S.finance[c]={balance:20,budget:8}})}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function money(n){return '$'+Number(n||0).toFixed(1)+'m'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function schedule(teams){let a=[...teams],base=[];if(a.length%2)a.push(null);const n=a.length;for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if(x&&y)games.push([(r+i)%2?y:x,(r+i)%2?x:y]);}base.push(games);a=[a[0],a[n-1],...a.slice(1,n-1)]}let rounds=[];for(let i=0;i<34;i++)rounds.push(base[i%base.length].map(g=>[g[0],g[1]]));return rounds}
function makeLeague(teams){let table={};teams.forEach(t=>table[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return{teams:[...teams],table,fix:schedule(teams)}}
function basePlayers(team){let out=[];(DATA.realPlayers[team]||[]).forEach((raw,i)=>{let [name,pos,age,ov]=raw.split('|');out.push({id:uid(),name,pos,age:+age,ov:+ov,club:team,value:+Math.max(.2,(+ov-45)**2*.0025).toFixed(1),wage:Math.round(850+(+ov*72)),contract:1+(i%4),potential:Math.min(88,+ov+Math.floor(Math.random()*9))})});while(out.length<16){let ov=57+Math.floor(Math.random()*22);out.push({id:uid(),name:names[Math.floor(Math.random()*names.length)]+' '+surnames[Math.floor(Math.random()*surnames.length)],pos:positions[out.length%positions.length],age:18+Math.floor(Math.random()*19),ov,value:+Math.max(.2,(ov-45)**2*.0025).toFixed(1),wage:Math.round(800+ov*65),contract:1+Math.floor(Math.random()*4),potential:Math.min(86,ov+Math.floor(Math.random()*12)),club:team})}return out}
function init(){let s={season:2026,round:1,selected:'Melbourne City',balance:50,budget:15,finance:{},logs:[],form:{},players:{},market:[],offers:[],history:[],npl:{},cup:null,finished:false,stats:{}};allTeams().forEach(c=>{s.finance[c]={balance:20+Math.floor(Math.random()*31),budget:8+Math.floor(Math.random()*13)};s.form[c]=58+Math.floor(Math.random()*20);s.players[c]=basePlayers(c);s.stats[c]={wins:0,goals:0};});s.t1=makeLeague(DATA.tier1);s.t2=makeLeague(DATA.tier2);Object.keys(DATA.npl).forEach(k=>s.npl[k]=makeLeague(DATA.npl[k]));refreshMarket(s);return s}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
if(!S)S=init(); ensureFinance();
function standings(l){return Object.values(l.table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.team.localeCompare(b.team))}
function findLeague(c){if(S.t1.teams.includes(c))return ['A-League',S.t1];if(S.t2.teams.includes(c))return ['Tier 2',S.t2];for(const [k,l] of Object.entries(S.npl))if(l.teams.includes(c))return ['NPL '+k,l];return ['',null]}
function strength(c){return S.form[c]||60}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return Math.min(6,k-1)}
function match(a,b){let[x,y]=[poisson(.65+strength(a)/72),poisson(.55+strength(b)/76)];return[x,y]}
function playRound(l,label,r){(l.fix[r-1]||[]).forEach(([a,b])=>{let[x,y]=match(a,b),A=l.table[a],B=l.table[b];A.p++;B.p++;A.gf+=x;A.ga+=y;B.gf+=y;B.ga+=x;if(x>y){A.w++;B.l++;A.pts+=3;S.form[a]=Math.min(92,S.form[a]+1);S.form[b]=Math.max(40,S.form[b]-1)}else if(y>x){B.w++;A.l++;B.pts+=3;S.form[b]=Math.min(92,S.form[b]+1);S.form[a]=Math.max(40,S.form[a]-1)}else{A.d++;B.d++;A.pts++;B.pts++}S.stats[a].goals+=x;S.stats[b].goals+=y;S.logs.unshift(label+': '+a+' '+x+'-'+y+' '+b);});}
function check34(){return [S.t1,S.t2,...Object.values(S.npl)].every(l=>Object.values(l.table).every(t=>t.p===34))}
function simRound(){if(S.finished){alert('Season finished. Use Previous/Next Season in History or start a new season.');return}if(S.round>34){finish();return}playRound(S.t1,'A-League',S.round);playRound(S.t2,'Tier 2',S.round);Object.entries(S.npl).forEach(([k,l])=>playRound(l,'NPL '+k,S.round));S.round++;if(S.round===35&&!check34()){alert('Fixture integrity check failed. Season was not advanced.');S.round=34;return}aiTransfers();progressPlayers();if(S.round%5===0)refreshMarket(S);save();page('home')}
function table(l,n=18){return '<table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+standings(l).slice(0,n).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.team)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+(x.gf-x.ga)+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</table>'}
function posn(c){let [,l]=findLeague(c);return l?(standings(l).findIndex(x=>x.team===c)+1):'-'}
function home(){let leader=standings(S.t1)[0];document.getElementById('app').innerHTML='<section class="card"><div class="muted">SEASON '+S.season+'/'+(S.season+1)+' • ROUND '+Math.min(34,S.round-1)+'/34</div><h2>'+esc(S.selected)+'</h2><div class="actions"><button class="primary" onclick="simRound()">⚡ Simulate Next Round</button><button onclick="for(let i=0;i<5&&S.round<=34;i++)simRound()">⏩ Simulate 5 Rounds</button><button onclick="page(\'history\')">🗂 Seasons</button></div><div class="grid"><div class="card"><div class="muted">A-League leader</div><div class="stat">'+esc(leader.team)+'</div><div>'+leader.pts+' pts</div></div><div class="card"><div class="muted">Your position</div><div class="stat">'+posn(S.selected)+'</div><div>Form '+Math.round(S.form[S.selected])+'</div></div><div class="card"><div class="muted">Club balance</div><div class="stat">'+money(clubMoney(S.selected).balance)+'</div><div>Transfer budget '+money(clubMoney(S.selected).budget)+'</div></div></div></section><div class="grid"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1,6)+'</section><section class="card"><h3>📰 Latest</h3>'+S.logs.slice(0,10).map(x=>'<div class="news">'+esc(x)+'</div>').join('')+'</section></div>'}
function club(){document.getElementById('app').innerHTML='<section class="card"><h2>⭐ Club</h2><select onchange="S.selected=this.value;save();page(\'club\')">'+allTeams().map(c=>'<option '+(c===S.selected?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">League position</div><div class="stat">'+posn(S.selected)+'</div></div><div class="card"><div class="muted">Balance</div><div class="stat">'+money(clubMoney(S.selected).balance)+'</div></div><div class="card"><div class="muted">Transfer budget</div><div class="stat">'+money(clubMoney(S.selected).budget)+'</div></div></div></section>'}
function squad(){let ps=S.players[S.selected]||[];document.getElementById('app').innerHTML='<section class="card"><h2>👥 Squad — '+esc(S.selected)+'</h2><p class="muted">Real player seeds are used where available; other squad slots are generated as realistic career-mode players.</p>'+ps.map(p=>'<div class="player"><div><b>'+esc(p.name)+'</b> <span class="pill">'+p.pos+' • OVR '+p.ov+'</span><br><span class="muted">'+p.age+' yrs • value '+money(p.value)+' • $'+p.wage+'/wk • '+p.contract+' yr • potential '+p.potential+'</span></div><button onclick="listPlayer(\''+p.id+'\')">List</button></div>').join('')+'</section>'}
function getP(id){for(const c of Object.keys(S.players)){let p=S.players[c].find(x=>x.id===id);if(p)return p}return null}
function refreshMarket(s=S){s.market=[];allTeams().forEach(c=>{let ps=s.players[c]||[];ps.filter(p=>p.ov>=65).sort(()=>Math.random()-.5).slice(0,2).forEach(p=>s.market.push({...p,asking:+(p.value*(1.05+Math.random()*.25)).toFixed(1)}))})}
function listPlayer(id){let p=getP(id);if(!p||p.club!==S.selected)return;if(!S.market.some(x=>x.id===id))S.market.push({...p,asking:+(p.value*1.12).toFixed(1)});S.logs.unshift('TRANSFER LISTED: '+p.name+' is available for offers.');save();page('market')}
function market(){document.getElementById('app').innerHTML='<section class="card"><h2>💰 Transfer Market</h2><p class="muted">Make an offer, negotiate a counter-offer, accept or reject bids. Accepted transfers remove the player from the old club and update both clubs money.</p><div class="actions"><button onclick="refreshMarket();save();page(\'market\')">🔎 Refresh Scouting</button><input id="q" placeholder="Search player / club / position" oninput="renderMarket()"></div><div id="ml"></div></section><section class="card"><h3>📨 Incoming offers</h3>'+incomingOffers()+'</section>' ;renderMarket()}
function renderMarket(){let q=(document.getElementById('q')?.value||'').toLowerCase();let m=S.market.filter(p=>p.club!==S.selected&&(p.name+' '+p.club+' '+p.pos).toLowerCase().includes(q));document.getElementById('ml').innerHTML=m.map(p=>'<div class="player"><div><b>'+esc(p.name)+'</b> <span class="pill">'+p.pos+' • OVR '+p.ov+'</span><br><span class="muted">'+esc(p.club)+' • '+p.age+' yrs • value '+money(p.value)+' • asking '+money(p.asking)+'</span></div><button onclick="makeOffer(\''+p.id+'\')">Offer</button></div>').join('')||'<p class="muted">No targets found.</p>'}
function makeOffer(id){let p=getP(id);if(!p||p.club===S.selected)return;let raw=prompt('Offer for '+p.name+' (asking '+money(p.value)+')',p.value.toFixed(1));let amount=Number(raw);if(!amount||amount<=0)return;if(amount>clubMoney(S.selected).budget){alert('That exceeds your transfer budget.');return}let chance=amount>=p.value*1.12?1:amount>=p.value*.98?.75:.35;if(Math.random()<chance){completeTransfer(p,S.selected,amount);alert('Deal accepted! '+p.name+' has joined '+S.selected+'.')}else{let counter=+(p.value*(1.1+Math.random()*.2)).toFixed(1);S.offers.push({id:uid(),player:p.name,playerId:p.id,from:p.club,to:S.selected,amount:counter});S.logs.unshift('NEGOTIATION: '+p.club+' countered '+money(counter)+' for '+p.name+'.');alert('The club rejected your bid and countered at '+money(counter)+'. You can accept or reject it in Market.');save();page('market')}}
function incomingOffers(){return S.offers.filter(o=>o.to===S.selected).map(o=>'<div class="player"><div><b>'+esc(o.player)+'</b><br><span class="muted">'+esc(o.from)+' bid '+money(o.amount)+'</span></div><div class="actions"><button class="primary" onclick="acceptOffer(\''+o.id+'\')">Accept</button><button onclick="counterOffer(\''+o.id+'\')">Ask more</button><button class="danger" onclick="rejectOffer(\''+o.id+'\')">Reject</button></div></div>').join('')||'<p class="muted">No bids right now.</p>'}
function completeTransfer(p,buyer,amount){let seller=p.club;S.players[seller]=S.players[seller].filter(x=>x.id!==p.id);p.club=buyer;S.players[buyer].push(p);S.market=S.market.filter(x=>x.id!==p.id);S.logs.unshift('TRANSFER COMPLETE: '+p.name+' moved from '+seller+' to '+buyer+' for '+money(amount)+'.');clubMoney(seller).balance+=amount;clubMoney(seller).budget+=amount*.8;clubMoney(buyer).budget-=amountsave()}
function acceptOffer(oid){let o=S.offers.find(x=>x.id===oid);if(!o)return;let p=getP(o.playerId);if(!p||p.club!==S.selected)return;if(o.amount<0.1)return;completeTransfer(p,o.from,o.amount);S.offers=S.offers.filter(x=>x.id!==oid);page('market')}
function counterOffer(oid){let o=S.offers.find(x=>x.id===oid);if(!o)return;let v=Number(prompt('Ask for how much?',(o.amount*1.15).toFixed(1)));if(!v||v<=o.amount)return;let p=getP(o.playerId);if(!p)return;o.amount=+v.toFixed(1);S.logs.unshift('COUNTER BID: '+S.selected+' wants '+p.name+' sold for '+money(o.amount)+'.');save();page('market')}
function rejectOffer(oid){S.offers=S.offers.filter(x=>x.id!==oid);S.logs.unshift('TRANSFER: '+S.selected+' rejected a bid.');save();page('market')}
function aiTransfers(){let clubs=allTeams();
  // AI clubs can bid for players you have listed. You choose accept / ask more / reject.
  let listed=(S.market||[]).filter(p=>p.club===S.selected);
  listed.forEach(p=>{if(Math.random()<0.28&&!S.offers.some(o=>o.playerId===p.id)){let buyers=clubs.filter(c=>c!==S.selected&&clubMoney(c).budget>=p.value*.8);if(buyers.length){let buyer=buyers[Math.floor(Math.random()*buyers.length)];let amount=+(p.value*(1.0+Math.random()*.25)).toFixed(1);S.offers.push({id:uid(),player:p.name,playerId:p.id,from:buyer,to:S.selected,amount});S.logs.unshift('BID RECEIVED: '+buyer+' offered '+money(amount)+' for '+p.name+'.')}}});
  for(let i=0;i<3;i++){let seller=clubs[Math.floor(Math.random()*clubs.length)],buyer=clubs[Math.floor(Math.random()*clubs.length)];if(seller===buyer)continue;let p=(S.players[seller]||[]).filter(x=>x.ov>=68).sort(()=>Math.random()-.5)[0];if(!p)continue;let fee=+(p.value*(.95+Math.random()*.35)).toFixed(1);if(clubMoney(buyer).budget>=fee&&Math.random()<.18){S.players[seller]=S.players[seller].filter(x=>x.id!==p.id);p.club=buyer;S.players[buyer].push(p);clubMoney(seller).balance+=fee;clubMoney(seller).budget+=fee*.8;clubMoney(buyer).budget-=fee;S.logs.unshift('AI TRANSFER: '+p.name+' joined '+buyer+' from '+seller+' for '+money(fee)+'.')}}}
function progressPlayers(){allTeams().forEach(c=>(S.players[c]||[]).forEach(p=>{if(p.age<25&&p.ov<p.potential&&Math.random()<.25)p.ov++;if(p.age>31&&Math.random()<.12)p.ov=Math.max(45,p.ov-1);p.value=+Math.max(.2,(p.ov-45)**2*.0025).toFixed(1)}))}
function tables(){let h='<h2>📊 Tables</h2><div class="grid"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1)+'</section><section class="card"><h3>🥈 Tier 2</h3>'+table(S.t2)+'</section>';for(let k in S.npl)h+='<section class="card"><h3>🥉 NPL '+k+'</h3>'+table(S.npl[k])+'</section>';document.getElementById('app').innerHTML=h+'</div>'}
function fixtures(){let l=findLeague(S.selected)[1]||S.t1;let r=Math.min(34,S.round);let games=l.fix[r-1]||[];document.getElementById('app').innerHTML='<section class="card"><h2>📅 Round '+r+'/34 — '+esc(findLeague(S.selected)[0])+'</h2>'+games.map(x=>'<div class="fixture"><span>'+esc(x[0])+'<br>vs<br>'+esc(x[1])+'</span><span class="score">'+((r<S.round)?'Played':'Upcoming')+'</span></div>').join('')+'</section>'}
function newCup(){let teams=allTeams().slice(0,32).sort(()=>Math.random()-.5);S.cup={round:1,teams,current:[],history:[],champion:null};makeCupRound();save();page('cup')}
function makeCupRound(){let c=S.cup;c.current=[];for(let i=0;i<c.teams.length;i+=2)c.current.push({a:c.teams[i],b:c.teams[i+1],done:false})}
function cup(){if(!S.cup)newCup();else renderCup()}
function renderCup(){let c=S.cup,names={1:'Round of 32',2:'Round of 16',3:'Quarter-finals',4:'Semi-finals',5:'Final'};document.getElementById('app').innerHTML='<section class="card"><h2>🏆 Australia Cup</h2><div class="muted">'+(c.champion?'COMPLETE — '+esc(c.champion):names[c.round])+'</div><div class="actions"><button class="primary" onclick="playCup()" '+(c.champion?'disabled':'')+'>⚽ Play Next Match</button><button onclick="newCup()">🎲 New Draw</button></div><p class="muted">Matches play one at a time. Winners advance; the tournament never skips straight to the final.</p></section><section class="card"><h3>Matches</h3>'+c.current.map(m=>'<div class="fixture"><span>'+esc(m.a)+'<br>vs<br>'+esc(m.b)+'</span><span class="score">'+(m.done?m.x+'-'+m.y:'⌛')+'</span></div>').join('')+'</section><section class="card"><h3>📜 Cup history</h3>'+c.history.slice(0,20).map(x=>'<div class="news">'+esc(x)+'</div>').join('')+'</section>'}
function playCup(){let c=S.cup,m=c.current.find(x=>!x.done);if(!m){advanceCup();save();renderCup();return}let[x,y]=match(m.a,m.b);if(x===y)x++;m.x=x;m.y=y;m.done=true;let w=x>y?m.a:m.b;c.history.unshift('Cup: '+m.a+' '+x+'-'+y+' '+m.b+' — '+w+' advance.');if(c.current.every(x=>x.done))advanceCup();save();renderCup()}
function advanceCup(){let c=S.cup,w=c.current.map(m=>m.x>m.y?m.a:m.b);if(w.length===1){c.champion=w[0];c.history.unshift('🏆 AUSTRALIA CUP CHAMPIONS: '+w[0]);return}c.round++;c.teams=w;makeCupRound()}
function finish(){if(S.finished)return;S.finished=true;let a=standings(S.t1),b=standings(S.t2);if(!check34()){alert('Season integrity error: not every team reached 34 games.');return}S.logs.unshift('🏆 A-LEAGUE CHAMPIONS: '+a[0].team);S.logs.unshift('🔺 PROMOTED: '+b[0].team+' and '+b[1].team);S.logs.unshift('🔻 RELEGATED: '+a[16].team+' and '+a[17].team);S.history.push(snapshot());save();page('home')}
function snapshot(){return {season:S.season,champion:standings(S.t1)[0].team,t1:standings(S.t1).map(x=>({...x})),t2:standings(S.t2).map(x=>({...x})),cup:S.cup?.champion||null}}
function seasonTeams(base,remove,add){return [...base.filter(x=>!remove.includes(x)),...add]}
function newSeason(){if(!S.finished&&S.round<=34){if(!confirm('The season is not finished. Start the next season anyway?'))return}if(!S.finished&&S.round===35)finish();let oldT1=standings(S.t1),oldT2=standings(S.t2);let rel1=oldT1.slice(-2).map(x=>x.team),prom=oldT2.slice(0,2).map(x=>x.team);let t1=seasonTeams(DATA.tier1,rel1,prom),t2=seasonTeams(DATA.tier2,prom,rel1);let n=init();n.season=S.season+1;n.selected=S.selected;n.finance=S.finance;n.balance=clubMoney(S.selected).balance;n.budget=clubMoney(S.selected).budget;n.players=S.players;n.form=S.form;n.logs=['SEASON '+n.season+': promotion and relegation applied.'];n.history=[...S.history];n.t1=makeLeague(t1);n.t2=makeLeague(t2);n.npl=S.npl;Object.keys(n.npl).forEach(k=>{n.npl[k]=makeLeague(n.npl[k].teams)});n.finished=false;n.round=1;n.cup=null;S=n;ensureFinance();save();page('home')}
function loadHistory(i){let h=S.history[i];if(!h)return;document.getElementById('app').innerHTML='<section class="card"><h2>🗂 Season '+h.season+'/'+(h.season+1)+'</h2><p>Champion: <b>'+esc(h.champion)+'</b> • Australia Cup: <b>'+esc(h.cup||'Not recorded')+'</b></p><h3>A-League final table</h3>'+h.t1.map((x,j)=>'<div class="fixture"><span>'+(j+1)+'. '+esc(x.team)+'</span><span>'+x.pts+' pts • '+x.p+' games</span></div>').join('')+'<div class="actions"><button onclick="page(\'home\')">Back to current season</button></div></section>'}
function history(){document.getElementById('app').innerHTML='<section class="card"><h2>🗂 Season History</h2><p class="muted">Current season: '+S.season+'. Completed seasons are saved here so you can go back and inspect them instead of being forced forward.</p>'+S.history.map((h,i)=>'<div class="fixture"><span><b>'+h.season+'/'+(h.season+1)+'</b><br><span class="muted">Champion: '+esc(h.champion)+'</span></span><button onclick="loadHistory('+i+')">View</button></div>').join('')+'<div class="actions"><button class="primary" onclick="newSeason()">➡️ Start Next Season</button></div></section>'}
function news(){document.getElementById('app').innerHTML='<section class="card"><h2>📰 News</h2>'+S.logs.slice(0,80).map(x=>'<div class="news">'+esc(x)+'</div>').join('')+'</section>'}
function page(x){({home,club,squad,market,tables,fixtures,cup,history,news}[x]||home)()}
page('home');
</script></body></html>
