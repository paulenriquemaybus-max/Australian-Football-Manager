<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Australian Football Manager V6</title>
<style>
body{margin:0;background:#07111f;color:#f5f7fb;font-family:system-ui,Arial}
header{padding:15px;background:#10243c;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}
.sub,.muted{color:#9fb1c9;font-size:12px}nav{display:flex;gap:6px;overflow:auto;padding:8px;background:#0d1929;position:sticky;top:66px;z-index:5}
button,select,input{background:#172943;color:#fff;border:1px solid #3c5375;border-radius:9px;padding:9px;font-weight:700}
button.primary{background:#176348}button.danger{background:#562532}main{max-width:1150px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#111e31;border:1px solid #2a3c59;border-radius:14px;padding:14px;margin-bottom:12px}
.stat{font-size:27px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #293a54;text-align:left}th{color:#9fb1c9}
.fixture,.player{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #293a54}
.score{font-weight:900}.news{padding:8px;margin:5px 0;background:#14233a;border-left:3px solid #5280c4}
.pill{font-size:11px;background:#223754;border-radius:20px;padding:4px 7px}.good{color:#73e2a1}.warn{color:#ffd166}.bad{color:#ff8b8b}
.rarity{font-size:11px;font-weight:900;border:1px solid #536b8f;border-radius:20px;padding:4px 7px}.rarity.Common{background:#27364a}.rarity.Uncommon{background:#203c55}.rarity.Rare{background:#27305d}.rarity.Elite{background:#3a2b5b}.rarity.WorldClass{background:#554018}.rarity.Legendary{background:#5b2525}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:600px;margin:auto}.slot{min-height:60px;background:#142c29;border:1px dashed #568e7b;border-radius:12px;padding:8px;text-align:center}
.small{font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}.modal>div{max-width:600px;width:calc(100% - 30px);background:#111e31;border:1px solid #3c5375;border-radius:14px;padding:16px}
@media(max-width:600px){h1{font-size:19px}.lineup{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>🇦🇺 Australian Football Manager V6</h1>
<div class="sub">34-match seasons • world transfer pool • rarity scouting • custom XI • transfer bids • season history • finances</div></header>
<nav>
<button onclick="page('home')">🏠</button><button onclick="page('club')">⭐ Club</button><button onclick="page('squad')">👥 Squad</button>
<button onclick="page('lineup')">🧠 Lineup</button><button onclick="page('market')">💰 Transfers</button><button onclick="page('tables')">📊 Tables</button>
<button onclick="page('fixtures')">📅 Fixtures</button><button onclick="page('cup')">🏆 Cup</button><button onclick="page('history')">🗂 History</button><button onclick="page('news')">📰 News</button>
</nav><main id="app"></main>
<script src="data.js"></script><script>
const KEY='afm_v5';
const allTeams=()=>[...DATA.tier1,...DATA.tier2,...Object.values(DATA.npl).flat()];
const names=['Alex','Noah','Luca','Kai','Ethan','Mason','Leo','Oscar','Jack','Ryan','Cooper','Dylan','Max','Jayden','Oliver','Finn','Riley','Charlie','Liam','Theo'];
const surnames=['Smith','Brown','Wilson','Taylor','Jones','Williams','Miller','Davis','Moore','Walker','Young','King','Martin','White','Clark','Hall'];
const positions=['GK','CB','CB','LB','RB','CM','CM','CAM','LW','ST','RW'];
let S=JSON.parse(localStorage.getItem(KEY)||'null');

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function money(n){return '$'+Number(n||0).toFixed(1)+'m'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clubMoney(c){if(!S.finance[c])S.finance[c]={balance:25,budget:10};return S.finance[c]}
function ensureFinance(){S.finance=S.finance||{};allTeams().forEach(c=>{if(!S.finance[c])S.finance[c]={balance:25,budget:10}})}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function schedule(teams){
 let a=[...teams],base=[];if(a.length%2)a.push(null);const n=a.length;
 for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if(x&&y)games.push([(r+i)%2?y:x,(r+i)%2?x:y])}base.push(games);a=[a[0],a[n-1],...a.slice(1,n-1)]}
 let rounds=[];for(let i=0;i<34;i++)rounds.push(base[i%base.length].map(g=>[g[0],g[1]]));return rounds
}
function makeLeague(teams){let table={};teams.forEach(t=>table[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return{teams:[...teams],table,fix:schedule(teams)}}
function rarityRoll(){
 let r=Math.random()*100,acc=0;for(const x of WORLD_RARITIES){acc+=x.chance;if(r<acc)return x}return WORLD_RARITIES[0]
}
function rarityClass(n){return n.replace(/\s/g,'')}
function rarityForOVR(ov){return WORLD_RARITIES.slice().reverse().find(r=>ov>=r.min)?.name||'Common'}
function player(name,pos,age,ov,club,rarity){
 let value=Math.max(.2,(ov-45)**2*.0025);
 return {id:uid(),name,pos,age:+age,ov:+ov,club,value:+value.toFixed(1),wage:Math.round(800+ov*70),contract:1+Math.floor(Math.random()*4),potential:Math.min(94,ov+Math.floor(Math.random()*10)),rarity:rarity||rarityForOVR(ov)}
}
function basePlayers(team){
 let out=[];
 (DATA.realPlayers[team]||[]).forEach(raw=>{let [name,pos,age,ov]=raw.split('|');out.push(player(name,pos,+age,+ov,team,rarityForOVR(+ov)))});
 while(out.length<18){let ov=57+Math.floor(Math.random()*22);out.push(player(names[Math.floor(Math.random()*names.length)]+' '+surnames[Math.floor(Math.random()*surnames.length)],positions[out.length%positions.length],18+Math.floor(Math.random()*19),ov,team))}
 return out
}
function makeWorldPool(){
 let pool=[];
 // Known world stars are rare/exact seeds; the rest are procedurally generated so the market stays large.
 WORLD_NAMES.forEach(([n,pos])=>pool.push(player(n,pos,19+Math.floor(Math.random()*18),82+Math.floor(Math.random()*10),'World Pool','World Class')));
 for(let i=0;i<900;i++){
  let r=rarityRoll(),ov=r.min+Math.floor(Math.random()*(r.max-r.min+1));
  let p=player(names[Math.floor(Math.random()*names.length)]+' '+surnames[Math.floor(Math.random()*surnames.length)],positions[Math.floor(Math.random()*positions.length)],17+Math.floor(Math.random()*24),ov,'World Pool',r.name);
  p.name+=' '+String(i+1);pool.push(p)
 }
 return pool
}
function init(){
 let s={season:2026,round:1,selected:'Melbourne City',finance:{},logs:[],form:{},players:{},market:[],offers:[],history:[],npl:{},cup:null,finished:false,stats:{},lineups:{},worldPool:makeWorldPool(),marketSeen:[],seasonSnapshots:{},listedPlayers:[],incomingBids:[]};
 allTeams().forEach(c=>{s.finance[c]={balance:20+Math.floor(Math.random()*31),budget:8+Math.floor(Math.random()*13)};s.form[c]=58+Math.floor(Math.random()*20);s.players[c]=basePlayers(c);s.stats[c]={wins:0,goals:0};s.lineups[c]=[]});
 s.t1=makeLeague(DATA.tier1);s.t2=makeLeague(DATA.tier2);Object.keys(DATA.npl).forEach(k=>s.npl[k]=makeLeague(DATA.npl[k]));
 return s
}
function repairState(){
 if(!S||!S.players)return init();
 S.finance=S.finance||{};S.offers=S.offers||[];S.history=S.history||[];S.logs=S.logs||[];S.lineups=S.lineups||{};S.worldPool=S.worldPool||makeWorldPool();S.market=S.market||[];S.seasonSnapshots=S.seasonSnapshots||{};S.listedPlayers=S.listedPlayers||[];S.incomingBids=S.incomingBids||[];
 ensureFinance();
 // Remove duplicate player IDs/names from club squads and never show a player currently owned by any club.
 const owned=new Set(),usedNames=new Set();
 allTeams().forEach(c=>{S.players[c]=(S.players[c]||[]).filter(p=>{if(!p.id)p.id=uid();if(owned.has(p.id)||usedNames.has(p.name))return false;owned.add(p.id);usedNames.add(p.name);p.club=c;p.rarity=p.rarity||rarityForOVR(p.ov);return true})});
 S.market=S.market.filter(p=>!owned.has(p.id)&&p.club==='World Pool');
 S.worldPool=S.worldPool.filter(p=>!owned.has(p.id));
 return S
}
S=repairState();save();


function cloneState(obj){return JSON.parse(JSON.stringify(obj))}
function makeSeasonSnapshot(){
  S.seasonSnapshots=S.seasonSnapshots||{};
  const k=String(S.season);
  if(!S.seasonSnapshots[k]){
    S.seasonSnapshots[k]={
      season:S.season,round:S.round,selected:S.selected,
      finance:cloneState(S.finance),form:cloneState(S.form),players:cloneState(S.players),
      t1:cloneState(S.t1),t2:cloneState(S.t2),npl:cloneState(S.npl),
      cup:cloneState(S.cup),stats:cloneState(S.stats),lineups:cloneState(S.lineups),
      market:cloneState(S.market),worldPool:cloneState(S.worldPool),
      listedPlayers:cloneState(S.listedPlayers),incomingBids:cloneState(S.incomingBids),
      offers:cloneState(S.offers),logs:cloneState(S.logs)
    };
  }
}
function generateIncomingBids(force){
  S.listedPlayers=S.listedPlayers||[];S.incomingBids=S.incomingBids||[];
  const club=S.selected;
  S.listedPlayers.filter(x=>x.club===club).forEach(item=>{
    const existing=S.incomingBids.find(b=>b.club===club&&b.playerId===item.playerId&&
      (b.status==='pending'||b.status==='countered'));
    if(existing)return;
    if(!force && Math.random()>0.55)return;
    const candidates=allTeams().filter(c=>c!==club);
    if(!candidates.length)return;
    const fromClub=candidates[Math.floor(Math.random()*candidates.length)];
    const asking=Number(item.asking||0);
    const amount=Math.max(.1,+(asking*(.90+Math.random()*.25)).toFixed(1));
    S.incomingBids.push({
      id:uid(),club,playerId:item.playerId,playerName:item.playerName,
      fromClub,amount,status:'pending',created:Date.now()
    });
  });
}
function restartPastSeason(season){
  const snap=(S.seasonSnapshots||{})[String(season)];
  if(!snap){alert('No saved starting point exists for that season.');return}
  if(!confirm('Restart '+season+'/'+(season+1)+'? Everything that happened during that season will be undone, including players bought/sold and money earned.'))return;
  S.season=snap.season;S.round=snap.round;S.selected=snap.selected;
  S.finance=cloneState(snap.finance);S.form=cloneState(snap.form);S.players=cloneState(snap.players);
  S.t1=cloneState(snap.t1);S.t2=cloneState(snap.t2);S.npl=cloneState(snap.npl);
  S.cup=cloneState(snap.cup);S.stats=cloneState(snap.stats);S.lineups=cloneState(snap.lineups);
  S.market=cloneState(snap.market);S.worldPool=cloneState(snap.worldPool);
  S.listedPlayers=cloneState(snap.listedPlayers);S.incomingBids=[];S.offers=[];
  S.finished=false;S.logs=cloneState(snap.logs);
  S.logs.unshift('🔄 RESTARTED '+season+'/'+(season+1)+': returned to the start of the season.');
  save();page('home');
}

function standings(l){return Object.values(l.table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.team.localeCompare(b.team))}
function findLeague(c){if(S.t1.teams.includes(c))return ['A-League',S.t1];if(S.t2.teams.includes(c))return ['Tier 2',S.t2];for(const[k,l]of Object.entries(S.npl))if(l.teams.includes(c))return['NPL '+k,l];return['',null]}
function strength(c){return S.form[c]||60}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return Math.min(6,k-1)}
function match(a,b){return[poisson(.65+strength(a)/72),poisson(.55+strength(b)/76)]}
function playRound(l,label,r){(l.fix[r-1]||[]).forEach(([a,b])=>{let[x,y]=match(a,b),A=l.table[a],B=l.table[b];A.p++;B.p++;A.gf+=x;A.ga+=y;B.gf+=y;B.ga+=x;if(x>y){A.w++;B.l++;A.pts+=3}else if(y>x){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}S.logs.unshift(label+': '+a+' '+x+'-'+y+' '+b)})}
function check34(){return [S.t1,S.t2,...Object.values(S.npl)].every(l=>Object.values(l.table).every(t=>t.p===34))}
function progressPlayers(){allTeams().forEach(c=>(S.players[c]||[]).forEach(p=>{if(p.age<25&&p.ov<p.potential&&Math.random()<.25)p.ov++;if(p.age>31&&Math.random()<.12)p.ov=Math.max(45,p.ov-1);p.value=+Math.max(.2,(p.ov-45)**2*.0025).toFixed(1)}))}
function simulateAITransfers(){
 let clubs=allTeams();
 for(let i=0;i<4;i++){let seller=clubs[Math.floor(Math.random()*clubs.length)],buyer=clubs[Math.floor(Math.random()*clubs.length)];if(seller===buyer)continue;
  let ps=(S.players[seller]||[]).filter(p=>p.ov>=68);let p=ps[Math.floor(Math.random()*ps.length)];if(!p)continue;
  let fee=+(p.value*(.95+Math.random()*.35)).toFixed(1);if(clubMoney(buyer).budget>=fee&&Math.random()<.16){
   S.players[seller]=S.players[seller].filter(x=>x.id!==p.id);p.club=buyer;S.players[buyer].push(p);
   clubMoney(seller).balance+=fee;clubMoney(seller).budget+=fee*.8;clubMoney(buyer).budget-=fee;S.market=S.market.filter(x=>x.id!==p.id);
   S.logs.unshift('AI TRANSFER: '+p.name+' joined '+buyer+' from '+seller+' for '+money(fee))
  }
 }
}
function simRound(){if(S.finished){alert('Season finished. Use History or Start Next Season.');return}if(S.round>34){finish();return}
 playRound(S.t1,'A-League',S.round);playRound(S.t2,'Tier 2',S.round);Object.entries(S.npl).forEach(([k,l])=>playRound(l,'NPL '+k,S.round));S.round++;
 if(S.round===35&&!check34()){alert('Fixture integrity check failed.');S.round=34;return}
 simulateAITransfers();progressPlayers();generateIncomingBids(false);if(S.round%5===0)refreshMarket();save();page('home')}
function table(l,n=18){return'<table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+standings(l).slice(0,n).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.team)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+(x.gf-x.ga)+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</table>'}
function posn(c){let[,l]=findLeague(c);return l?(standings(l).findIndex(x=>x.team===c)+1):'-'}
function home(){let leader=standings(S.t1)[0];document.getElementById('app').innerHTML='<section class="card"><div class="muted">SEASON '+S.season+'/'+(S.season+1)+' • ROUND '+Math.min(34,S.round-1)+'/34</div><h2>'+esc(S.selected)+'</h2><div class="actions"><button class="primary" onclick="simRound()">⚡ Simulate Next Round</button><button onclick="for(let i=0;i<5&&S.round<=34;i++)simRound()">⏩ 5 Rounds</button><button onclick="restartSeason()">🔄 Restart This Season</button></div><div class="grid"><div class="card"><div class="muted">A-League leader</div><div class="stat">'+esc(leader.team)+'</div><div>'+leader.pts+' pts</div></div><div class="card"><div class="muted">Your position</div><div class="stat">'+posn(S.selected)+'</div><div>Form '+Math.round(S.form[S.selected])+'</div></div><div class="card"><div class="muted">Club finances</div><div class="stat">'+money(clubMoney(S.selected).balance)+'</div><div>Transfer budget '+money(clubMoney(S.selected).budget)+'</div></div></div></section><div class="grid"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1,6)+'</section><section class="card"><h3>📰 Latest</h3>'+S.logs.slice(0,10).map(x=>'<div class="news">'+esc(x)+'</div>').join('')+'</section></div>'}
function club(){document.getElementById('app').innerHTML='<section class="card"><h2>⭐ Club</h2><select onchange="S.selected=this.value;save();page(\'club\')">'+allTeams().map(c=>'<option '+(c===S.selected?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Position</div><div class="stat">'+posn(S.selected)+'</div></div><div class="card"><div class="muted">Balance</div><div class="stat">'+money(clubMoney(S.selected).balance)+'</div></div><div class="card"><div class="muted">Transfer budget</div><div class="stat">'+money(clubMoney(S.selected).budget)+'</div></div></div></section>'}
function squad(){let ps=S.players[S.selected]||[];document.getElementById('app').innerHTML='<section class="card"><h2>👥 Squad — '+esc(S.selected)+'</h2>'+ps.map(p=>'<div class="player"><div><b>'+esc(p.name)+'</b> <span class="pill">'+p.pos+' • OVR '+p.ov+'</span> <span class="rarity '+rarityClass(p.rarity)+'">'+esc(p.rarity)+'</span><br><span class="muted">'+p.age+' yrs • value '+money(p.value)+' • '+p.contract+' yr • potential '+p.potential+'</span></div><button onclick="listPlayer(\''+p.id+'\')">List</button></div>').join('')+'</section>'}

function uniqueName(base){
 let n=base, i=2, all=[...Object.values(S.players).flat(),...S.market,...S.worldPool];
 while(all.some(p=>p.name===n)){n=base+' '+i;i++}return n
}
function worldMarketCount(){return Math.max(12,Math.min(30,10+Math.floor(S.season%7)*2))}
function refreshMarket(){
 const ownedIds=new Set(allTeams().flatMap(c=>(S.players[c]||[]).map(p=>p.id)));
 const ownedNames=new Set(allTeams().flatMap(c=>(S.players[c]||[]).map(p=>p.name)));
 S.market=[];
 let pool=S.worldPool.filter(p=>!ownedIds.has(p.id)&&!ownedNames.has(p.name));
 for(let i=0;i<worldMarketCount();i++){
  if(!pool.length)break;let idx=Math.floor(Math.random()*pool.length),p=pool.splice(idx,1)[0];
  p.asking=+(p.value*(1.05+Math.random()*.3)).toFixed(1);S.market.push(p)
 }
 S.marketSeen=S.market.map(p=>p.id)
 S.logs.unshift('SCOUTING: '+S.market.length+' world transfer targets discovered.')
 save()
}

function listPlayerV621(id){
 let p=(S.players[S.selected]||[]).find(x=>x.id===id); if(!p)return;
 const old=(S.listedPlayers||[]).find(x=>x.club===S.selected&&x.playerId===id);
 const suggested=Number(p.value||Math.max(.2,(p.ov-45)**2*.0025));
 const raw=prompt('Asking price for '+p.name+' (in millions):',old?old.asking.toFixed(1):suggested.toFixed(1));
 if(raw===null)return;
 const asking=Number(raw);
 if(!asking||asking<=0){alert('Enter a valid asking price.');return}
 S.listedPlayers=S.listedPlayers||[];
 if(old) old.asking=asking;
 else S.listedPlayers.push({id:uid(),club:S.selected,playerId:id,playerName:p.name,pos:p.pos,ov:p.ov,asking,created:Date.now()});
 p.listed=true;p.listedAsking=asking;
 generateIncomingBids(true);
 S.logs.unshift('📋 LISTED: '+p.name+' for '+money(asking));
 save(); alert(p.name+' is listed. An incoming bid has been generated so you can test the transfer system.'); page('squad');
}
function incomingOffersV621(){
 const bids=(S.incomingBids||[]).filter(b=>b.club===S.selected&&(b.status==='pending'||b.status==='countered'));
 return bids.length?bids.map(b=>'<div class="player"><div><b>📨 '+esc(b.playerName)+'</b><br><span class="muted">🏟️ Buying club: <b>'+esc(b.fromClub)+'</b></span><br><span class="muted">💰 Offer: '+money(b.amount)+'</span></div><div class="actions"><button class="primary" onclick="acceptBidV621(\''+b.id+'\')">Accept</button><button onclick="counterBidV621(\''+b.id+'\')">Ask More</button><button class="danger" onclick="rejectBidV621(\''+b.id+'\')">Reject</button></div></div>').join(''):'<p class="muted">No incoming bids. List a player to generate one immediately.</p>';
}
function findBidV621(id){return (S.incomingBids||[]).find(b=>b.id===id)}
function acceptBidV621(id){
 const b=findBidV621(id);if(!b)return;
 const squad=S.players[S.selected]||[],i=squad.findIndex(p=>p.id===b.playerId);
 if(i<0){alert('That player is no longer at your club.');return}
 const p=squad[i];
 if((S.players[b.fromClub]||[]).some(x=>x.id===p.id||x.name===p.name)){alert('Transfer blocked: duplicate player detected.');return}
 squad.splice(i,1);p.club=b.fromClub;p.listed=false;delete p.listedAsking;
 S.players[b.fromClub]=S.players[b.fromClub]||[];S.players[b.fromClub].push(p);
 clubMoney(S.selected).balance+=Number(b.amount);clubMoney(S.selected).budget+=Number(b.amount);
 clubMoney(b.fromClub).budget=Math.max(0,clubMoney(b.fromClub).budget-Number(b.amount));
 S.incomingBids=S.incomingBids.filter(x=>x.id!==id);
 S.listedPlayers=S.listedPlayers.filter(x=>!(x.club===S.selected&&x.playerId===b.playerId));
 S.logs.unshift('TRANSFER COMPLETE: '+p.name+' sold to '+b.fromClub+' for '+money(b.amount));
 save();alert(p.name+' has joined '+b.fromClub+' for '+money(b.amount)+'.');page('squad');
}
function rejectBidV621(id){
 const b=findBidV621(id);if(!b)return;
 S.incomingBids=S.incomingBids.filter(x=>x.id!==id);
 S.logs.unshift('BID REJECTED: '+b.fromClub+' offer for '+b.playerName+' was rejected.');
 save();page('squad');
}
function counterBidV621(id){
 const b=findBidV621(id);if(!b)return;
 const requested=Number(prompt('Ask the club for how much? (millions)',(b.amount*1.15).toFixed(1)));
 if(!requested||requested<=b.amount){alert('Counter-offer must be higher than the current bid.');return}
 // AI response: either accepts the requested fee or returns a revised offer.
 if(Math.random()<0.65){
   b.amount=+requested.toFixed(1);b.status='pending';
   save();alert(b.fromClub+' accepted your counter-offer of '+money(b.amount)+'.');acceptBidV621(id);
 }else{
   const revised=+(b.amount+(requested-b.amount)*0.45).toFixed(1);
   b.amount=revised;b.status='pending';
   save();alert(b.fromClub+' countered back with '+money(revised)+'.');page('squad');
 }
}
function market(){
 generateIncomingBids(false);
 document.getElementById('app').innerHTML=
 '<section class="card"><h2>🌍 Global Transfer Market</h2><div class="grid"><div><h3>Rarity chances</h3>'+
 WORLD_RARITIES.map(r=>'<div class="fixture"><span><span class="rarity '+rarityClass(r.name)+'">'+r.name+'</span></span><b>'+r.chance+'%</b></div>').join('')+
 '</div><div><h3>How it works</h3><p class="muted">Worldwide players, rarity scouting, player listings and incoming bids.</p><div class="actions"><button class="primary" onclick="refreshMarket();page(\'market\')">🔎 Scout World</button><button onclick="page(\'squad\')">📋 Manage Listings</button></div></div></div></section>'+
 '<section class="card"><h3>🌐 Available players</h3><input id="q" placeholder="Search name / position / rarity" oninput="renderMarket()"><div id="ml"></div></section>'+
 '<section class="card"><h3>📨 Incoming bids</h3>'+incomingOffersV621()+'</section>';
 renderMarket();save();
}
function renderMarket(){
 let q=(document.getElementById('q')?.value||'').toLowerCase();
 let m=S.market.filter(p=>(p.name+' '+p.pos+' '+p.rarity).toLowerCase().includes(q));
 document.getElementById('ml').innerHTML=m.map(p=>'<div class="player"><div><b>'+esc(p.name)+'</b> <span class="pill">'+p.pos+' • OVR '+p.ov+'</span> <span class="rarity '+rarityClass(p.rarity)+'">'+esc(p.rarity)+'</span><br><span class="muted">'+p.age+' yrs • value '+money(p.value)+' • asking '+money(p.asking)+'</span></div><button onclick="makeOffer(\''+p.id+'\')">Offer</button></div>').join('')||'<p class="muted">No targets match. Scout again.</p>'
}

function best11(){
 let ps=[...(S.players[S.selected]||[])].sort((a,b)=>b.ov-a.ov),used=new Set(),out=[];
 const want=['GK','LB','CB','CB','RB','CM','CM','CAM','LW','ST','RW'];
 want.forEach(pos=>{let p=ps.find(x=>x.pos===pos&&!used.has(x.id));if(!p)p=ps.find(x=>!used.has(x.id));if(p){used.add(p.id);out.push(p.id)}});
 return out
}
function lineup(){
 let club=S.selected,ps=S.players[club]||[],ids=S.lineups[club]||[];
 document.getElementById('app').innerHTML='<section class="card"><h2>🧠 Lineup Builder</h2><p class="muted">Build your own XI or let Best XI choose the strongest balanced lineup automatically.</p><div class="actions"><button class="primary" onclick="autoLineup()">🤖 Best XI</button><button onclick="clearLineup()">🧹 Clear</button><button onclick="saveLineup()">💾 Save XI</button></div><div class="lineup">'+Array.from({length:11},(_,i)=>{let p=ps.find(x=>x.id===ids[i]);return '<div class="slot"><b>Slot '+(i+1)+'</b><br>'+ (p?esc(p.name)+'<br><span class="small">'+p.pos+' • '+p.ov+'</span>':'Empty')+'<br><select onchange="setSlot('+i+',this.value)"><option value="">Choose...</option>'+ps.map(x=>'<option value="'+x.id+'" '+(p&&p.id===x.id?'selected':'')+'>'+esc(x.name)+' — '+x.pos+' '+x.ov+'</option>').join('')+'</select></div>'}).join('')+'</div></section><section class="card"><h3>Current XI</h3>'+ids.map((id,i)=>{let p=ps.find(x=>x.id===id);return p?'<div class="fixture"><span>'+(i+1)+'. '+esc(p.name)+'</span><span>'+p.pos+' • OVR '+p.ov+'</span></div>':''}).join('')+'</section>'
}
function setSlot(i,id){let arr=[...(S.lineups[S.selected]||[])];while(arr.length<11)arr.push('');if(id&&arr.some((x,j)=>x===id&&j!==i)){alert('That player is already in the XI.');return}arr[i]=id;S.lineups[S.selected]=arr;save();lineup()}
function autoLineup(){S.lineups[S.selected]=best11();save();lineup()}
function clearLineup(){S.lineups[S.selected]=[];save();lineup()}
function saveLineup(){let ids=S.lineups[S.selected]||[];if(ids.filter(Boolean).length!==11){alert('Choose 11 players first.');return}S.logs.unshift('LINEUP SAVED: '+S.selected+' XI updated.');save();alert('Best/custom XI saved!')}
function tables(){let h='<h2>📊 Tables</h2><div class="grid"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1)+'</section><section class="card"><h3>🥈 Tier 2</h3>'+table(S.t2)+'</section>';for(let k in S.npl)h+='<section class="card"><h3>🥉 NPL '+k+'</h3>'+table(S.npl[k])+'</section>';document.getElementById('app').innerHTML=h+'</div>'}
function fixtures(){let[,l]=findLeague(S.selected),r=Math.min(34,S.round);let games=l.fix[r-1]||[];document.getElementById('app').innerHTML='<section class="card"><h2>📅 Round '+r+'/34</h2>'+games.map(x=>'<div class="fixture"><span>'+esc(x[0])+'<br>vs<br>'+esc(x[1])+'</span><span class="score">'+(r<S.round?'Played':'Upcoming')+'</span></div>').join('')+'</section>'}
function newCup(){let teams=allTeams().slice(0,32).sort(()=>Math.random()-.5);S.cup={round:1,teams,current:[],history:[],champion:null};makeCupRound();save();page('cup')}
function makeCupRound(){let c=S.cup;c.current=[];for(let i=0;i<c.teams.length;i+=2)c.current.push({a:c.teams[i],b:c.teams[i+1],done:false})}
function cup(){if(!S.cup)newCup();else renderCup()}
function renderCup(){let c=S.cup,n={1:'Round of 32',2:'Round of 16',3:'Quarter-finals',4:'Semi-finals',5:'Final'};document.getElementById('app').innerHTML='<section class="card"><h2>🏆 Australia Cup</h2><div class="muted">'+(c.champion?'COMPLETE — '+esc(c.champion):n[c.round])+'</div><div class="actions"><button class="primary" onclick="playCup()" '+(c.champion?'disabled':'')+'>⚽ Play Next Match</button><button onclick="newCup()">🎲 New Draw</button></div></section><section class="card"><h3>Matches</h3>'+c.current.map(m=>'<div class="fixture"><span>'+esc(m.a)+'<br>vs<br>'+esc(m.b)+'</span><span class="score">'+(m.done?m.x+'-'+m.y:'⌛')+'</span></div>').join('')+'</section>'}
function playCup(){let c=S.cup,m=c.current.find(x=>!x.done);if(!m){advanceCup();save();renderCup();return}let[x,y]=match(m.a,m.b);if(x===y)x++;m.x=x;m.y=y;m.done=true;if(c.current.every(x=>x.done))advanceCup();save();renderCup()}
function advanceCup(){let c=S.cup,w=c.current.map(m=>m.x>m.y?m.a:m.b);if(w.length===1){c.champion=w[0];c.history.unshift('🏆 AUSTRALIA CUP CHAMPIONS: '+w[0]);return}c.round++;c.teams=w;makeCupRound()}
function snapshot(){return{season:S.season,champion:standings(S.t1)[0].team,t1:standings(S.t1).map(x=>({...x})),t2:standings(S.t2).map(x=>({...x})),cup:S.cup?.champion||null}}
function finish(){if(S.finished)return;if(!check34()){alert('Season integrity error: not every team reached 34 games.');return}S.finished=true;let a=standings(S.t1),b=standings(S.t2);S.logs.unshift('🏆 A-LEAGUE CHAMPIONS: '+a[0].team);S.logs.unshift('🔺 PROMOTED: '+b[0].team+' and '+b[1].team);S.logs.unshift('🔻 RELEGATED: '+a[a.length-2].team+' and '+a[a.length-1].team);S.history.push(snapshot());save();page('home')}
function clone(obj){return JSON.parse(JSON.stringify(obj))}
function restartSeason(){
 makeSeasonSnapshot();
 restartPastSeason(S.season);
}
function newSeason(){
 if(!S.finished&&S.round<=34){if(!confirm('Start the next season before finishing this one?'))return}
 if(S.round===35&&!S.finished)finish();
 let oldT1=standings(S.t1),oldT2=standings(S.t2),rel=oldT1.slice(-2).map(x=>x.team),prom=oldT2.slice(0,2).map(x=>x.team);
 let t1=[...S.t1.teams.filter(x=>!rel.includes(x)),...prom],t2=[...S.t2.teams.filter(x=>!prom.includes(x)),...rel];
 let keepPlayers=clone(S.players),keepFinance=clone(S.finance),keepForm=clone(S.form),hist=clone(S.history);
 S.season++;S.round=1;S.finished=false;S.t1=makeLeague(t1);S.t2=makeLeague(t2);S.npl=Object.fromEntries(Object.entries(S.npl).map(([k,l])=>[k,makeLeague(l.teams)]));
 S.players=keepPlayers;S.finance=keepFinance;S.form=keepForm;S.history=hist;S.cup=null;S.offers=[];S.market=[];S.listedPlayers=[];S.incomingBids=[];S.stats={};allTeams().forEach(c=>S.stats[c]={wins:0,goals:0});
 S.logs=['SEASON '+S.season+': promotion and relegation applied.'];refreshMarket();makeSeasonSnapshot();save();page('home')
}
function history(){document.getElementById('app').innerHTML='<section class="card"><h2>🗂 Season History</h2>'+S.history.map((h,i)=>'<div class="fixture"><span><b>'+h.season+'/'+(h.season+1)+'</b><br><span class="muted">Champion: '+esc(h.champion)+'</span></span><button onclick="alert(\'Historical season: '+esc(h.season)+' — Champion: '+esc(h.champion)+'\')">View</button></div>').join('')+'<div class="actions"><button class="primary" onclick="newSeason()">➡️ Start Next Season</button><button onclick="restartSeason()">🔄 Restart Current Season</button></div></section>'}
function news(){document.getElementById('app').innerHTML='<section class="card"><h2>📰 News</h2>'+S.logs.slice(0,100).map(x=>'<div class="news">'+esc(x)+'</div>').join('')+'</section>'}
function page(x){({home,club,squad,lineup,market,tables,fixtures,cup,history,news}[x]||home)()}
if(!S.market.length)refreshMarket();page('home');
