<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Australian Football Manager V3</title>
<style>
body{margin:0;background:#08111f;color:#f5f7fb;font-family:system-ui,Arial}header{padding:16px;background:#10233b;position:sticky;top:0;z-index:3}h1{margin:0;font-size:22px}.sub{color:#9fb1c9;font-size:12px}nav{display:flex;gap:6px;overflow:auto;padding:8px;background:#0d1929;position:sticky;top:67px;z-index:3}button,select,input{background:#172943;color:white;border:1px solid #3c5375;border-radius:9px;padding:9px;font-weight:700}button.primary{background:#176348}button.danger{background:#562532}main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#111e31;border:1px solid #2a3c59;border-radius:14px;padding:14px}.muted{color:#9fb1c9}.stat{font-size:29px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #293a54;text-align:left}th{color:#9fb1c9}.fixture,.player{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #293a54}.score{font-weight:900}.news{padding:8px;margin:5px 0;background:#14233a;border-left:3px solid #5280c4}.pill{font-size:11px;background:#223754;border-radius:20px;padding:4px 7px}@media(max-width:600px){nav{top:67px}h1{font-size:19px}}
</style></head><body>
<header><h1>🇦🇺 Australian Football Manager V3</h1><div class="sub">Interactive Cup • realistic transfer market • promotion/relegation • auto-save</div></header>
<nav><button onclick="page('home')">🏠</button><button onclick="page('club')">⭐ Club</button><button onclick="page('squad')">👥 Squad</button><button onclick="page('market')">💰 Market</button><button onclick="page('tables')">📊 Tables</button><button onclick="page('fixtures')">📅 Fixtures</button><button onclick="page('cup')">🏆 Cup</button><button onclick="page('news')">📰 News</button></nav>
<main id="app"></main>
<script src="data.js"></script><script>
const KEY="afm_v3"; const names=["Alex","Noah","Luca","Kai","Ethan","Mason","Leo","Oscar","Jack","Ryan","Cooper","Dylan","Max","Jayden","Oliver","Finn"];const surnames=["Smith","Brown","Wilson","Taylor","Jones","Williams","Miller","Davis","Moore","Walker","Young","King"];const pos=["GK","CB","CB","LB","RB","CM","CM","CAM","LW","ST","RW"];
let S=JSON.parse(localStorage.getItem(KEY)||"null");
const all=()=>[...DATA.tier1,...DATA.tier2,...Object.values(DATA.npl).flat()];
function rr(ts){let a=[...ts];if(a.length%2)a.push(null);let out=[],n=a.length;for(let r=0;r<n-1;r++){let g=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if(x&&y)g.push([(r+i)%2?y:x,(r+i)%2?x:y])}out.push(g);a=[a[0],a[n-1],...a.slice(1,n-1)]}return out.concat(out.map(g=>g.map(x=>[x[1],x[0]])))}
function league(ts){let table={};ts.forEach(t=>table[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return{teams:[...ts],table,fix:rr(ts)}}
function players(team){return Array.from({length:16},(_,i)=>{let ov=55+Math.floor(Math.random()*27),age=17+Math.floor(Math.random()*18);return{id:team+"-"+i,name:names[Math.floor(Math.random()*names.length)]+" "+surnames[Math.floor(Math.random()*surnames.length)],age,pos:pos[i%pos.length],ov,club:team,value:+Math.max(.2,(ov-45)**2*.002).toFixed(1),wage:Math.round(800+ov*60),contract:1+Math.floor(Math.random()*4)}})}
function init(){let s={season:2026,round:1,selected:"Melbourne City",budget:35,logs:[],form:{},players:{},market:[],t1:league(DATA.tier1),t2:league(DATA.tier2),npl:{},cup:null,finished:false};Object.keys(DATA.npl).forEach(k=>s.npl[k]=league(DATA.npl[k]));all().forEach(c=>{s.form[c]=50+Math.floor(Math.random()*25);s.players[c]=players(c)});refreshMarket(s);return s}
function refreshMarket(s){s.market=[];all().forEach(c=>{let p=s.players[c][Math.floor(Math.random()*s.players[c].length)];s.market.push({...p,asking:+(p.value*(.9+Math.random()*.35)).toFixed(1)})})}
if(!S)S=init();function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function standings(l){return Object.values(l.table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
function strength(c){return S.form[c]||55}function goal(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return Math.min(6,k-1)}
function result(a,b){return[Math.min(6,goal(.55+strength(a)/75)),Math.min(6,goal(.45+strength(b)/80))]}
function playLeague(l,label,r){(l.fix[r-1]||[]).forEach(([a,b])=>{let[x,y]=result(a,b),A=l.table[a],B=l.table[b];A.p++;B.p++;A.gf+=x;A.ga+=y;B.gf+=y;B.ga+=x;if(x>y){A.w++;B.l++;A.pts+=3;S.form[a]=Math.min(90,S.form[a]+1);S.form[b]=Math.max(40,S.form[b]-1)}else if(y>x){B.w++;A.l++;B.pts+=3;S.form[b]=Math.min(90,S.form[b]+1);S.form[a]=Math.max(40,S.form[a]-1)}else{A.d++;B.d++;A.pts++;B.pts++}S.logs.unshift(label+": "+a+" "+x+"-"+y+" "+b)})}
function simRound(){if(S.finished){alert("Season finished — start the next season.");return}if(S.round>34){finish();return}playLeague(S.t1,"A-League",S.round);playLeague(S.t2,"Tier 2",S.round);Object.entries(S.npl).forEach(([k,l])=>{if(S.round<=l.fix.length)playLeague(l,"NPL "+k,S.round)});S.round++;if(S.round%4===0)S.logs.unshift("SCOUTING: clubs are monitoring transfer targets.");save();page("home")}
function table(l,n=18){return "<table><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr>"+standings(l).slice(0,n).map((x,i)=>"<tr><td>"+(i+1)+"</td><td>"+x.team+"</td><td>"+x.p+"</td><td>"+(x.gf-x.ga)+"</td><td><b>"+x.pts+"</b></td></tr>").join("")+"</table>"}
function home(){let a=standings(S.t1);document.getElementById("app").innerHTML='<section class="card"><div class="muted">SEASON '+S.season+'/'+(S.season+1)+' • ROUND '+Math.min(34,S.round-1)+'/34</div><h2>'+S.selected+'</h2><div class="actions"><button class="primary" onclick="simRound()">⚡ Simulate Next Round</button><button onclick="for(let i=0;i<5&&S.round<=34;i++)simRound()">⏩ Simulate 5</button><button class="danger" onclick="newSeason()">♻️ New Season</button></div><div class="grid"><div><div class="muted">A-League leader</div><div class="stat">'+a[0].team+'</div><div>'+a[0].pts+' pts</div></div><div><div class="muted">Position</div><div class="stat">'+posn(S.selected)+'</div><div>Form '+Math.round(S.form[S.selected])+'</div></div><div><div class="muted">Budget</div><div class="stat">$'+S.budget.toFixed(1)+'m</div><div>Transfer market active</div></div></div></section><div class="grid" style="margin-top:12px"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1,6)+'</section><section class="card"><h3>📰 Latest</h3>'+S.logs.slice(0,10).map(x=>'<div class="news">'+x+'</div>').join("")+'</section></div>'}
function posn(c){for(let l of [S.t1,S.t2,...Object.values(S.npl)]){let i=standings(l).findIndex(x=>x.team===c);if(i>=0)return i+1}return"-"}
function club(){document.getElementById("app").innerHTML='<section class="card"><h2>⭐ Club</h2><select onchange="S.selected=this.value;save();page(\'club\')">'+all().map(c=>'<option '+(c===S.selected?'selected':'')+'>'+c+'</option>').join("")+'</select><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">League position</div><div class="stat">'+posn(S.selected)+'</div></div><div class="card"><div class="muted">Team form</div><div class="stat">'+Math.round(S.form[S.selected])+'</div></div><div class="card"><div class="muted">Budget</div><div class="stat">$'+S.budget.toFixed(1)+'m</div></div></div></section>'}
function squad(){let ps=S.players[S.selected]||[];document.getElementById("app").innerHTML='<section class="card"><h2>👥 Squad — '+S.selected+'</h2><p class="muted">FIFA-style simplified ratings, values, wages and contracts.</p>'+ps.map(p=>'<div class="player"><div><b>'+p.name+'</b> <span class="pill">'+p.pos+'</span><br><span class="muted">'+p.age+' yrs • OVR '+p.ov+' • $'+p.value.toFixed(1)+'m • $'+p.wage+'/wk • '+p.contract+' yr</span></div><button onclick="list(\''+p.id+'\')">List</button></div>').join("")+'</section>'}
function getP(id){for(let c of Object.keys(S.players)){let p=S.players[c].find(x=>x.id===id);if(p)return p}return null}
function list(id){let p=getP(id);if(p&&!S.market.some(x=>x.id===id))S.market.push({...p,asking:+(p.value*1.05).toFixed(1)});S.logs.unshift("TRANSFER: "+p.name+" listed for $"+p.value.toFixed(1)+"m.");save();page("market")}
function market(){document.getElementById("app").innerHTML='<section class="card"><h2>💰 Transfer Market</h2><p class="muted">Scout targets, compare OVR/age/position/value, then make offers. Deals cost real budget and players actually move clubs.</p><div class="actions"><button onclick="refreshMarket();save();page(\'market\')">🔎 Refresh Scouting</button><input id="q" placeholder="Search player, club or position" oninput="renderMarket()"></div><div id="ml"></div></section>';renderMarket()}
function renderMarket(){let q=(document.getElementById("q")?.value||"").toLowerCase();let m=S.market.filter(p=>(p.name+" "+p.club+" "+p.pos).toLowerCase().includes(q));document.getElementById("ml").innerHTML=m.map(p=>'<div class="player"><div><b>'+p.name+'</b> <span class="pill">'+p.pos+' • OVR '+p.ov+'</span><br><span class="muted">'+p.age+' yrs • '+p.club+' • value $'+p.value.toFixed(1)+'m • asking $'+p.asking.toFixed(1)+'m • $'+p.wage+'/wk</span></div><button onclick="buy(\''+p.id+'\')">Offer</button></div>').join("")}
function buy(id){let p=getP(id);if(!p||p.club===S.selected)return;if(S.budget<p.asking){alert("Not enough budget.");return}S.players[p.club]=S.players[p.club].filter(x=>x.id!==id);p.club=S.selected;S.players[S.selected].push(p);S.budget-=p.asking;S.market=S.market.filter(x=>x.id!==id);S.logs.unshift("TRANSFER COMPLETE: "+p.name+" joined "+S.selected+" for $"+p.asking.toFixed(1)+"m.");save();page("market")}
function tables(){let h='<h2>📊 Tables</h2><div class="grid"><section class="card"><h3>🥇 A-League</h3>'+table(S.t1)+'</section><section class="card"><h3>🥈 Tier 2</h3>'+table(S.t2)+'</section>';for(let k in S.npl)h+='<section class="card"><h3>🥉 NPL '+k+'</h3>'+table(S.npl[k])+'</section>';document.getElementById("app").innerHTML=h+"</div>"}
function fixtures(){let g=S.t1.fix[Math.min(33,S.round-1)]||[];document.getElementById("app").innerHTML='<section class="card"><h2>📅 Current A-League Fixtures</h2>'+g.map(x=>'<div class="fixture">'+x[0]+'<br>vs<br>'+x[1]+'<span>—</span></div>').join("")+'</section>'}
function cup(){if(!S.cup)S.cup={round:0,teams:all().sort(()=>Math.random()-.5),matches:[],history:[]};let names=["Round of 128","Round of 64","Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];if(!S.cup.current)makeCupRound();let c=S.cup;document.getElementById("app").innerHTML='<section class="card"><h2>🏆 Australia Cup</h2><div class="muted">'+(names[c.round]||"Complete")+'</div><div class="actions"><button class="primary" onclick="playCup()">⚽ Play Next Match</button><button onclick="newCup()">🎲 New Draw</button></div><p class="muted">Matches are played one at a time. Winners advance to the next round — no instant tournament.</p></section><section class="card"><h3>Matches</h3>'+((c.current||[]).map((m,i)=>'<div class="fixture"><span>'+m.a+'<br>vs<br>'+m.b+'</span><span class="score">'+(m.done?m.x+"-"+m.y:"⌛")+'</span></div>').join(""))+'</section><section class="card"><h3>📜 Cup history</h3>'+c.history.slice(0,15).map(x=>'<div class="news">'+x+'</div>').join("")+'</section>'}
function makeCupRound(){let c=S.cup;if(c.teams.length<2){c.champion=c.teams[0];return}c.current=[];for(let i=0;i<c.teams.length;i+=2)c.current.push({a:c.teams[i],b:c.teams[i+1],done:false});}
function playCup(){let c=S.cup,m=c.current.find(x=>!x.done);if(!m){advanceCup();save();page("cup");return}let[x,y]=result(m.a,m.b);if(x===y)x++;m.x=x;m.y=y;m.done=true;let w=x>y?m.a:m.b;c.history.unshift("Cup: "+m.a+" "+x+"-"+y+" "+m.b+" — "+w+" advance.");if(c.current.every(x=>x.done))advanceCup();save();page("cup")}
function advanceCup(){let c=S.cup,w=c.current.map(m=>m.x>m.y?m.a:m.b);if(w.length===1){c.champion=w[0];c.history.unshift("🏆 AUSTRALIA CUP CHAMPIONS: "+w[0]);c.teams=[w[0]];c.current=[];return}c.round++;c.teams=w;makeCupRound()}
function newCup(){S.cup={round:0,teams:all().sort(()=>Math.random()-.5),current:[],history:[]};makeCupRound();save();page("cup")}
function news(){document.getElementById("app").innerHTML='<h2>📰 News</h2><section class="card">'+S.logs.map(x=>'<div class="news">'+x+'</div>').join("")+'</section>'}
function finish(){if(S.finished)return;S.finished=true;let a=standings(S.t1),b=standings(S.t2);S.logs.unshift("🏆 A-LEAGUE CHAMPIONS: "+a[0].team);S.logs.unshift("🔺 PROMOTED: "+b[0].team+" and "+b[1].team);S.logs.unshift("🔻 RELEGATED FROM TIER 1: "+a[16].team+" and "+a[17].team);S.logs.unshift("🔻 RELEGATED FROM TIER 2: "+b[16].team+" and "+b[17].team);save();page("home")}
function newSeason(){if(!S.finished){if(!confirm("The season isn't finished. Start a new one anyway?"))return}let a=standings(S.t1),b=standings(S.t2),n=init();n.season=S.season+1;n.selected=S.selected;n.budget=S.budget;
let releg=a.slice(16).map(x=>x.team),prom=b.slice(0,2).map(x=>x.team),t2releg=b.slice(16).map(x=>x.team);
releg.forEach(c=>{n.t1.teams=n.t1.teams.filter(x=>x!==c);delete n.t1.table[c];n.t2.teams.push(c);n.t2.table[c]=league([c]).table[c]});
prom.forEach(c=>{n.t2.teams=n.t2.teams.filter(x=>x!==c);delete n.t2.table[c];n.t1.teams.push(c);n.t1.table[c]=league([c]).table[c]});
t2releg.forEach(c=>{n.t2.teams=n.t2.teams.filter(x=>x!==c);delete n.t2.table[c]});
n.logs.unshift("SEASON "+n.season+": Promotion and relegation have been applied automatically.");S=n;save();page("home")}
function page(x){if(x==="home")home();if(x==="club")club();if(x==="squad")squad();if(x==="market")market();if(x==="tables")tables();if(x==="fixtures")fixtures();if(x==="cup")cup();if(x==="news")news()}
page("home");
</script></body></html>
